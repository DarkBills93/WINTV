<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte Nocturno - WNTV</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --naranja-fuego: #ff7b00;
            --amarillo-neon: #ffea00;
            --azul-wntv: #00c6ff;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            color: #e6f1f5;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            background: linear-gradient(344deg, #000000, #022b50, #000000);
            background-attachment: fixed;
        }
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background-image: url('img/logo.png'); 
            background-repeat: repeat;
            background-position: center;
            background-size: 140px;
            opacity: 0.08; 
            pointer-events: none;
        }
        .container { padding: 20px; text-align: center; position: relative; z-index: 1; }
        .hidden { display: none !important; }
        
        .logo-principal {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px auto;
            background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.72) 55%, transparent 40%);
            border-radius: 50%;
            padding: 18px 32px;
            width: fit-content;
            transition: all 0.4s ease;
            filter: drop-shadow(0 0 10px rgba(0, 198, 255, 0.8));
        }
        .logo-principal:hover { transform: scale(1.05); }
        .logo-principal img { width: 140px; }

        .neon-text { 
            color: #ffffff; 
            text-shadow: 0 0 8px var(--azul-wntv), 0 0 15px var(--azul-wntv); 
            font-size: 2.3rem; 
            margin-bottom: 25px; 
            font-weight: bold;
            text-transform: uppercase;
        }

        #login-section { display: flex; flex-direction: column; align-items: center; gap: 15px; }

        .input-login { 
            width: 100%; max-width: 350px; padding: 12px; border-radius: 8px; 
            border: 1px solid rgba(0, 198, 255, 0.3); background: rgba(0, 0, 0, 0.5); 
            color: #fff; outline: none; text-align: center;
        }

        /* --- ESTILO CALENDARIO JC ACTUALIZADO (Elegante y Circular) --- */
        #filtro-calendario {
            background: transparent !important;
            border: 2px solid #ffffff !important; 
            border-radius: 50px !important; 
            color: #ffffff !important; 
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 198, 255, 0.3);
            max-width: 200px;
        }

        .btn-main { 
            width: 100%; max-width: 350px; padding: 14px; border-radius: 12px; border: none; 
            color: white; font-weight: bold; cursor: pointer; transition: all 0.3s ease;
        }
        .btn-admin { background: linear-gradient(135deg, #0072ff 0%, #00c6ff 100%); }
        .btn-soporte-verde { background: linear-gradient(135deg, #00b09b 0%, #96c93d 100%) !important; }

        .btn-pdf-diario { background: linear-gradient(135deg, var(--naranja-fuego), #e65100) !important; color: white; padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-pdf-historico { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%) !important; color: white; padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-cerrar { background: linear-gradient(135deg, #cb2d3e 0%, #ef473a 100%) !important; }
        .btn-volver { background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%) !important; }
        
        .soporte-card { 
            background: rgba(255, 255, 255, 0.05); padding: 20px; border-radius: 15px; 
            margin-bottom: 15px; border-left: 5px solid var(--azul-wntv); text-align: left;
            backdrop-filter: blur(10px);
        }
        .user-tag { color: var(--azul-wntv); font-weight: bold; text-transform: uppercase; font-size: 1.1rem; }

        textarea { 
            width: 100%; height: 80px; background: rgba(0,0,0,0.3); color: #fff; 
            border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 10px; margin-top: 10px;
        }
        .btn-del { background: #ff4757; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }

        /* Estilos Flatpickr Personalizados */
        .flatpickr-calendar { background: #0d0d0d !important; border: 1px solid var(--azul-wntv) !important; box-shadow: 0 0 15px rgba(0, 198, 255, 0.4) !important; }
        
        /* Efecto entorno para el día seleccionado (Sin fondo sólido) */
        .flatpickr-day.selected { 
            background: transparent !important; 
            border: 2px solid var(--naranja-fuego) !important; 
            color: var(--naranja-fuego) !important; 
            box-shadow: 0 0 12px var(--naranja-fuego) !important; 
            font-weight: bold !important;
            border-radius: 50% !important;
        }

        /* Colores elegantes para el menú desplegable */
        .flatpickr-current-month { color: #ffffff !important; text-shadow: 0 0 5px var(--azul-wntv); }
        .flatpickr-weekday { color: var(--azul-wntv) !important; font-weight: bold !important; }
        .flatpickr-prev-month, .flatpickr-next-month { fill: #ffffff !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-principal"><img src="img/logo.png" alt="Logo WNTV"></div>
        <h1 class="neon-text">SOPORTE NOCTURNO</h1>

        <div id="login-section">
            <input type="password" id="pass-admin" class="input-login" placeholder="Contraseña Administrador">
            <button onclick="checkLogin()" class="btn-main btn-admin">ADMINISTRADOR</button>
            <button onclick="showUserPanel()" class="btn-main btn-soporte-verde">SOPORTE NOCTURNO</button>
        </div>

        <div id="admin-panel" class="hidden" style="max-width: 850px; margin: auto;">
            <h2 style="color: var(--azul-wntv); margin-bottom: 20px;">⚙️ Control Maestro - JC</h2>
            <div style="background: rgba(255,255,255,0.05); padding: 20px; border-radius: 15px;">
                <input type="text" id="nombre-cliente" class="input-login" placeholder="Nombre del Usuario">
                <button onclick="agregarCliente()" class="btn-main btn-admin" style="width: auto; padding: 12px 30px; margin-top: 10px;">+ Agregar</button>
            </div>
            
            <div style="margin: 25px 0; display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap;">
                <input type="text" id="filtro-calendario" class="input-login" placeholder="📅 Ver Fecha">
                <button onclick="exportarPDF(false)" class="btn-pdf-diario">📄 PDF Diario</button>
                <button onclick="exportarPDF(true)" class="btn-pdf-historico">📥 Reporte Histórico JC</button>
            </div>

            <div id="monitor-lista"></div>
            <button onclick="window.location.reload()" class="btn-main btn-cerrar" style="margin-top:20px; max-width: 200px;">Cerrar Sesión</button>
        </div>

        <div id="user-panel" class="hidden" style="max-width: 650px; margin: auto;">
            <div style="margin-bottom: 20px;">
                <label style="color: #96c93d; display: block; margin-bottom: 10px; font-weight: bold;">TÉCNICO DE TURNO:</label>
                <input type="text" id="nombre-tecnico" class="input-login" placeholder="Ej: María, Frank, Luis...">
            </div>
            <div id="lista-clientes-soporte"></div>
            <button onclick="guardarTodoElSoporte()" class="btn-main btn-soporte-verde">💾 Guardar Actividades y Enviar</button>
            <div id="log-historial-nocturno" style="margin-top: 30px;"></div>
            <button onclick="window.location.reload()" class="btn-main btn-volver" style="margin-top:30px; max-width: 200px;">⬅ Volver</button>
        </div>
    </div>
    <script type="module" src="soporte.js"></script>
</body>
</html>
