<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte Nocturno - WNTV</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            color: #e6f1f5;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            background: linear-gradient(344deg, #000000, #022b50, #000000);
            background-attachment: fixed;
        }
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background-image: url('img/logo.png'); 
            background-repeat: repeat;
            background-position: center;
            background-size: 140px;
            opacity: 0.08; 
            pointer-events: none;
        }
        .container { padding: 20px; text-align: center; position: relative; z-index: 1; }
        .hidden { display: none !important; }
        
        .logo-principal {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px auto;
            background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.72) 55%, transparent 40%);
            border-radius: 50%;
            padding: 18px 32px;
            width: fit-content;
            filter: drop-shadow(0 0 18px rgba(6, 104, 231, 0.5));
        }
        .logo-principal img { width: 140px; }
        .neon-text { 
            color: #ffffff; 
            text-shadow: 0 0 8px #00c6ff, 0 0 15px #00c6ff; 
            font-size: 2.3rem; 
            margin-bottom: 25px; 
            font-weight: bold;
            text-transform: uppercase;
        }

        #login-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        .input-login { 
            width: 100%; max-width: 350px; padding: 12px; border-radius: 8px; 
            border: 1px solid rgba(0, 198, 255, 0.3); background: rgba(0, 0, 0, 0.5); 
            color: #fff; outline: none; text-align: center;
        }
        
        /* BOTONES CON NUEVOS COLORES */
        .btn-main { 
            width: 100%; max-width: 350px; padding: 14px; border-radius: 12px; border: none; 
            background: linear-gradient(135deg, #0072ff 0%, #00c6ff 100%); color: white; 
            font-weight: bold; cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 198, 255, 0.3);
        }
        
        /* Botón Soporte Nocturno - Azul profundo */
        .btn-soporte {
            background: linear-gradient(135deg, #3a7bd5 0%, #00d2ff 100%);
        }

        /* Botón PDF Diario - Azul Grisáceo Profesional */
        .btn-pdf-diario {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%) !important;
            color: white; padding: 12px 20px; border: none; border-radius: 8px; 
            cursor: pointer; font-weight: bold;
        }

        /* Botón Histórico - Verde Esmeralda */
        .btn-pdf-historico {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%) !important;
            color: white; padding: 12px 20px; border: none; border-radius: 8px; 
            cursor: pointer; font-weight: bold;
        }

        /* Botón Cerrar Sesión - Rojo Coral */
        .btn-cerrar {
            background: linear-gradient(135deg, #cb2d3e 0%, #ef473a 100%) !important;
        }

        /* Botón Volver - Púrpura Indigo */
        .btn-volver {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%) !important;
        }
        
        .soporte-card { 
            background: rgba(255, 255, 255, 0.05); padding: 20px; border-radius: 15px; 
            margin-bottom: 15px; border-left: 5px solid #00c6ff; text-align: left;
            backdrop-filter: blur(10px);
        }
        textarea { 
            width: 100%; height: 80px; background: rgba(0,0,0,0.3); color: #fff; 
            border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 10px; margin-top: 10px;
        }
        .btn-del {
            background: #ff4757; color: white; border: none; padding: 6px 12px; 
            border-radius: 6px; cursor: pointer; font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-principal">
            <img src="img/logo.png" alt="Logo WNTV">
        </div>

        <h1 class="neon-text">SOPORTE NOCTURNO</h1>

        <div id="login-section">
            <input type="password" id="pass-admin" class="input-login" placeholder="Contraseña Administrador">
            <button onclick="checkLogin()" class="btn-main">ADMINISTRADOR</button>
            <button onclick="showUserPanel()" class="btn-main btn-soporte">SOPORTE NOCTURNO</button>
        </div>

        <div id="admin-panel" class="hidden" style="max-width: 850px; margin: auto;">
            <h2 style="color: #00c6ff; margin-bottom: 20px;">⚙️ Control Maestro - JC</h2>
            <div style="background: rgba(255,255,255,0.05); padding: 20px; border-radius: 15px;">
                <input type="text" id="nombre-cliente" class="input-login" placeholder="Nombre del Usuario">
                <button onclick="agregarCliente()" class="btn-main" style="width: auto; padding: 12px 30px; margin-top: 10px;">+ Agregar</button>
            </div>
            
            <div style="margin: 25px 0; display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap;">
                <input type="date" id="filtro-calendario" class="input-login" style="width: auto; cursor: pointer;" onclick="this.showPicker()" onchange="filtrarPorFecha(this.value)">
                <button onclick="exportarPDF(false)" class="btn-pdf-diario">📄 PDF Diario</button>
                <button onclick="exportarPDF(true)" class="btn-pdf-historico">📥 Reporte Histórico JC</button>
            </div>

            <div id="monitor-lista"></div>
            <button onclick="window.location.reload()" class="btn-main btn-cerrar" style="margin-top:20px; max-width: 200px;">Cerrar Sesión</button>
        </div>

        <div id="user-panel" class="hidden" style="max-width: 650px; margin: auto;">
            <div style="margin-bottom: 20px;">
                <label style="color: #00c6ff; display: block; margin-bottom: 10px; font-weight: bold;">TÉCNICO DE TURNO:</label>
                <input type="text" id="nombre-tecnico" class="input-login" placeholder="Ej: María, Frank, Luis...">
            </div>
            <div id="lista-clientes-soporte"></div>
            <button onclick="guardarTodoElSoporte()" class="btn-main">💾 Guardar Actividades y Enviar</button>
            
            <div id="log-historial-nocturno" style="margin-top: 30px;"></div>

            <button onclick="window.location.reload()" class="btn-main btn-volver" style="margin-top:30px; max-width: 200px;">⬅ Volver</button>
        </div>
    </div>

    <script type="module" src="soporte.js"></script>
</body>
</html>
