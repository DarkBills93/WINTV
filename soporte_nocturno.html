<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte Nocturno - WNTV</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        /* FONDO DEGRADADO PROFESIONAL REPARADO */
        body { 
            background: #050b14 radial-gradient(circle at top, #0d1a2d 0%, #050b14 100%) no-repeat fixed; 
            color: white; 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            min-height: 100vh; 
        }
        .hidden { display: none; }
        .container { padding: 20px; text-align: center; }
        
        /* LOGO CON BRILLO AMARILLO INTENSO */
        .logo-wrapper {
            width: 160px; height: 160px; 
            background: white; 
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 0 45px rgba(255, 255, 120, 0.6);
        }
        .logo-wrapper img { width: 85%; border-radius: 50%; }

        .neon-text { color: #ffffff; text-shadow: 0 0 15px #00c6ff; font-size: 2.5em; margin: 10px 0; }
        
        /* BOTONES LUMINOSOS */
        .btn-main { 
            width: 100%; max-width: 350px; padding: 14px; border-radius: 12px; border: none; 
            background: linear-gradient(135deg, #00c6ff 0%, #007bff 100%); color: white; 
            font-weight: bold; cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 198, 255, 0.4);
            margin-bottom: 10px;
        }
        .btn-main:hover { 
            box-shadow: 0 0 30px rgba(0, 198, 255, 0.8); 
            transform: translateY(-2px); 
        }

        .btn-secondary { background: #1a2a3a; box-shadow: 0 0 10px rgba(26, 42, 58, 0.4); }
        .btn-secondary:hover { background: #2c3e50; box-shadow: 0 0 20px rgba(52, 152, 219, 0.6); }

        .input-login { 
            width: 100%; max-width: 350px; padding: 12px; border-radius: 8px; 
            border: 1px solid #1a2a3a; background: #080f18; color: #fff; margin-bottom: 15px; 
        }
        
        /* TARJETAS DE SOPORTE */
        .soporte-card { 
            background: rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 12px; 
            margin-bottom: 15px; border-left: 4px solid #00c6ff; text-align: left; 
        }
        textarea { 
            width: 100%; height: 75px; background: #050b14; color: #fff; 
            border: 1px solid #1a2a3a; border-radius: 8px; padding: 10px; box-sizing: border-box; 
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-wrapper"><img src="img/logo.png" alt="Logo"></div>
        <h1 class="neon-text">SOPORTE NOCTURNO</h1>

        <div id="login-section">
            <input type="password" id="pass-admin" class="input-login" placeholder="Contraseña">
            <button onclick="checkLogin()" class="btn-main">ENTRAR COMO ADMIN</button>
            <button onclick="showUserPanel()" class="btn-main btn-secondary">ACCESO SOPORTE NOCTURNO</button>
        </div>

        <div id="admin-panel" class="hidden" style="max-width: 850px; margin: auto;">
            <h2 style="color: #00c6ff;">⚙️ Control Maestro - JC</h2>
            <input type="text" id="nombre-cliente" class="input-login" placeholder="Nombre del Usuario">
            <button onclick="agregarCliente()" class="btn-main" style="width: auto;">+ Agregar</button>
            
            <div style="margin: 25px 0;">
                <input type="date" id="filtro-calendario" class="input-login" style="width: auto;" onchange="filtrarPorFecha(this.value)">
                <button onclick="exportarPDF(false)" style="background:#e67e22; color:white; padding:12px; border:none; border-radius:8px; cursor:pointer;">📄 PDF Diario</button>
                <button onclick="exportarPDF(true)" style="background:#27ae60; color:white; padding:12px; border:none; border-radius:8px; cursor:pointer;">📥 Todo</button>
            </div>
            <div id="monitor-lista"></div>
            <button onclick="window.location.reload()" class="btn-main btn-secondary" style="margin-top:20px;">Cerrar Sesión</button>
        </div>

        <div id="user-panel" class="hidden" style="max-width: 600px; margin: auto;">
            <input type="text" id="nombre-tecnico" class="input-login" placeholder="Tu Nombre (Pepe, Rosita...)">
            <div id="lista-clientes-soporte"></div>
            <button onclick="guardarTodoElSoporte()" class="btn-main">💾 Guardar y Enviar</button>
            <div id="log-historial-nocturno"></div>
        </div>
    </div>
    <script type="module" src="soporte.js"></script>
</body>
</html>
