<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Fusiones - Planta Interna</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
            font-size: 14px;
        }
        th {
            background-color: #2c3e50;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .btn-edit {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-edit:hover {
            background-color: #2980b9;
        }
        .color-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            text-shadow: 0px 0px 2px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Gestión de Fusiones por Zona</h2>
    
    <div class="form-group">
        <label for="inputZona">Escriba o seleccione una Zona:</label>
        <input type="text" id="inputZona" list="listaZonas" placeholder="Ej. FLOR MARTEL 2..." oninput="mostrarDatosZona()">
        <datalist id="listaZonas">
            <option value="FLOR MARTEL 2">
            <option value="MOLINA 1">
            <option value="TREBOL">
            <option value="CORINTHIOS 3">
            <option value="BURGOS">
            <option value="VILLA ESPERANZA 2">
            <option value="JAZMINES 1">
            <option value="SINCHI ROCA">
            <option value="LOS ANGELES">
            <option value="VILLA ESPERANZA 1">
            <option value="CLAVELES">
            <option value="MOLINA 2">
            <option value="R28">
            <option value="PEDREGALITO 3">
            <option value="VALLE 2">
            <option value="CORINTHIOS 2">
            <option value="VALLE 1">
            <option value="PEDREGAL BAJO">
            <option value="PALOMAR 2">
            <option value="FLOR MARTEL 1">
            <option value="PALOMAR 1">
            <option value="CORINTHIOS">
            <option value="BELLA VISTA">
            <option value="PARADITA">
            <option value="PEDREGALITO 2">
            <option value="LOMAS ALTAS 2">
            <option value="LOMAS BAJAS 2">
            <option value="LOMAS BAJAS">
            <option value="PEDREGALITO 1">
            <option value="LOMAS ALTAS">
            <option value="VALLE SAGRADO 3">
            <option value="COLINA 2">
            <option value="VALLE SAGRADO 1">
            <option value="ALAMO 2 (A2)">
            <option value="ALAMO 3 (A3)">
            <option value="JAZMINES 2">
            <option value="ALAMO 5 (A5)">
            <option value="ALAMO 1">
            <option value="COLINA 1">
            <option value="VALLE SAGRADO 2">
            <option value="ALAMO 4 (A4)">
            <option value="VALLE SAGRADO 6">
            <option value="COLINA 3">
            <option value="VALLE SAGRADO 4">
            <option value="VALLE SAGRADO 5">
            <option value="AVICOP">
        </datalist>
    </div>

    <div id="resultadoContainer" style="display: none;">
        <h3 id="tituloZona"></h3>
        <table>
            <thead>
                <tr>
                    <th>Nro. de Caja</th>
                    <th>Hilo de Llegada</th>
                    <th>Hilo con que se fusiona (Color)</th>
                    <th>Estado de la Fibra</th>
                    <th>Código</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="tablaCuerpo">
                <!-- Se llena dinámicamente -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // Los 12 colores estándar de fibra óptica
    const coloresFibra = [
        { nombre: "Azul", hex: "#0000FF", text: "#FFFFFF" },
        { nombre: "Naranja", hex: "#FF8000", text: "#000000" },
        { nombre: "Verde", hex: "#008000", text: "#FFFFFF" },
        { nombre: "Marrón", hex: "#804000", text: "#FFFFFF" },
        { nombre: "Gris", hex: "#808080", text: "#FFFFFF" },
        { nombre: "Blanco", hex: "#FFFFFF", text: "#000000" },
        { nombre: "Rojo", hex: "#FF0000", text: "#FFFFFF" },
        { nombre: "Negro", hex: "#000000", text: "#FFFFFF" },
        { nombre: "Amarillo", hex: "#FFFF00", text: "#000000" },
        { nombre: "Violeta", hex: "#800080", text: "#FFFFFF" },
        { nombre: "Rosado", hex: "#FFC0CB", text: "#000000" },
        { nombre: "Celeste", hex: "#00FFFF", text: "#000000" }
    ];

    // Obtener lista completa de zonas desde el datalist
    function obtenerZonasValidas() {
        const options = document.querySelectorAll('#listaZonas option');
        const zonas = [];
        options.forEach(opt => zonas.push(opt.value));
        return zonas;
    }

    function mostrarDatosZona() {
        const zonaInput = document.getElementById("inputZona").value.trim().toUpperCase();
        const container = document.getElementById("resultadoContainer");
        const tbody = document.getElementById("tablaCuerpo");
        const tituloZona = document.getElementById("tituloZona");
        
        tbody.innerHTML = "";

        const zonasValidas = obtenerZonasValidas();

        if (!zonasValidas.includes(zonaInput)) {
            container.style.display = "none";
            return;
        }

        container.style.display = "block";
        tituloZona.innerText = "Registros de la Zona: " + zonaInput;

        // Generar 16 cajas ordenadas del 01 al 16 sin repetir
        for (let i = 1; i <= 16; i++) {
            let numeroCajaStr = i < 10 ? "Caja 0" + i : "Caja " + i;
            
            // Asignación de colores de ejemplo (puedes cambiarlo luego con base de datos)
            let colorLlegadaIndex = (i - 1) % 12;
            let colorFusionIndex = (i + 2) % 12;

            const colorLlegadaInfo = coloresFibra[colorLlegadaIndex];
            const colorFusionInfo = coloresFibra[colorFusionIndex];

            const spanLlegada = `<span class="color-badge" style="background-color: ${colorLlegadaInfo.hex}; color: ${colorLlegadaInfo.text};">Hilo ${i} (${colorLlegadaInfo.nombre})</span>`;
            const spanFusion = `<span class="color-badge" style="background-color: ${colorFusionInfo.hex}; color: ${colorFusionInfo.text};">${colorFusionInfo.nombre}</span>`;

            const fila = `
                <tr>
                    <td>${numeroCajaStr}</td>
                    <td>${spanLlegada}</td>
                    <td>${spanFusion}</td>
                    <td>Activo</td>
                    <td>COD-${i < 10 ? '00' + i : '0' + i}</td>
                    <td><button class="btn-edit" onclick="editarRegistro('${zonaInput}', '${numeroCajaStr}')">Editar</button></td>
                </tr>
            `;
            tbody.innerHTML += fila;
        }
    }

    function editarRegistro(zona, caja) {
        alert(`Editar registro de la Zona: ${zona} - ${caja}`);
    }
</script>

</body>
</html>
