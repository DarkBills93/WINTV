<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte Nocturno - WNTV</title>
    <link rel="stylesheet" href="../css/style.css">
    <!-- Librerías para PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        .hidden { display: none; }
        .soporte-card { 
            background: rgba(255, 255, 255, 0.05); padding: 20px; border-radius: 15px; 
            margin-bottom: 15px; border-left: 5px solid #00c6ff;
        }
        .admin-panel, .user-panel { max-width: 800px; margin: 20px auto; }
        
        /* DISEÑO ACCESO */
        .login-title { color: #00c6ff; text-align: center; font-weight: bold; margin-bottom: 15px; }
        .input-login {
            width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #fff;
            background: rgba(0,0,0,0.3); color: #fff; margin-bottom: 15px; box-sizing: border-box;
        }
        .btn-admin-login {
            width: 100%; padding: 12px; border-radius: 10px; border: none;
            background: linear-gradient(to bottom, #00c6ff, #007bff); color: white; font-weight: bold; cursor: pointer;
        }
        .btn-tech-login {
            width: 100%; padding: 12px; border-radius: 10px; border: none;
            background: #5b6fb3; color: white; font-weight: bold; cursor: pointer; margin-top: 15px;
        }

        /* DISEÑO PANEL ADMIN (Imagen enviada) */
        .box-admin {
            border: 1px solid #00c6ff77; border-radius: 15px; padding: 20px;
            background: rgba(10, 37, 64, 0.5); margin-bottom: 20px;
        }
        .input-admin {
            width: 100%; padding: 12px; background: #0d1b2a; border: 1px solid #ffffff33;
            color: white; border-radius: 8px; margin-bottom: 15px;
        }
        .btn-add-list {
            width: 100%; padding: 15px; background: #00c6ff; color: white;
            font-weight: bold; border-radius: 10px; border: none; cursor: pointer;
        }
        
        textarea {
            width: 100%; height: 100px; background: rgba(0, 0, 0, 0.4); color: #fff;
            border: 1px solid #00c6ff; border-radius: 8px; padding: 10px; resize: none;
        }
        .monitor-item {
            background: rgba(255,255,255,0.05); padding: 10px; margin: 5px 0;
            border-radius: 5px; display: flex; justify-content: space-between;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header" style="text-align: center; margin-bottom: 30px;">
            <img src="../img/logo.png" alt="Logo WNTV" style="width: 200px; border-radius: 50%; box-shadow: 0 0 20px #00c6ff;">
            <h1 class="neon-text" style="margin-top: 20px; letter-spacing: 2px;">SOPORTE NOCTURNO</h1>
        </div>

        <!-- ACCESO -->
        <div id="login-section" class="form-container" style="max-width: 450px; margin: auto;">
            <div class="login-title">Acceso al Sistema</div>
            <input type="password" id="pass-admin" class="input-login" placeholder="Contraseña Administrador">
            <button onclick="checkLogin()" class="btn-admin-login">Entrar como Admin</button>
            <button onclick="showUserPanel()" class="btn-tech-login">Entrar como Técnico</button>
        </div>

        <!-- PANEL ADMINISTRADOR -->
        <div id="admin-panel" class="admin-panel hidden">
            <div class="box-admin">
                <h3 style="color: #00c6ff; margin-bottom: 15px;">⚙️ Registro de Usuarios</h3>
                <input type="text" id="nombre-cliente" class="input-admin" placeholder="Nombre del Usuario a Soporte">
                <button onclick="agregarCliente()" class="btn-add-list">Añadir a la Lista</button>
            </div>
            
            <div class="box-admin">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h3 style="color: #00c6ff;">📊 Atención de Soporte Nocturno</h3>
                    <button onclick="exportarPDF()" style="background: #28a745; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold;">📥 Exportar Informe PDF</button>
                </div>
                <div id="monitor-lista"></div>
            </div>

            <button onclick="window.location.reload()" class="btn-tech-login" style="background: #5b6fb3;">Volver</button>
        </div>

        <!-- PANEL TÉCNICO -->
        <div id="user-panel" class="user-panel hidden">
            <h2 style="color: #00c6ff;">📝 Registro de Actividades</h2>
            <div class="form-container" style="margin-bottom: 20px;">
                <input type="text" id="nombre-tecnico" placeholder="Nombre del Técnico de Turno" style="border-color: #00c6ff; padding: 10px; width: 100%; border-radius: 8px; background: transparent; color: white;">
            </div>

            <div id="lista-clientes-soporte"></div>
            
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="guardarTodoElSoporte()" class="btn-guardar" style="flex: 2;">💾 Guardar Registro Final</button>
                <button onclick="window.location.reload()" class="btn-tech-login" style="flex: 1; margin: 0;">Volver</button>
            </div>

            <div style="margin-top: 40px;">
                <h3 style="color: #00c6ff; text-align: center;">📋 Historial de Atenciones</h3>
                <div id="log-historial-nocturno"></div>
            </div>
        </div>
    </div>
    <script src="soporte.js"></script>
</body>
</html>
