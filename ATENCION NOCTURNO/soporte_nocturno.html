<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte Nocturno - WNTV</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .hidden { display: none; }
        .soporte-card { 
            background: rgba(255, 255, 255, 0.05); 
            padding: 20px; 
            border-radius: 15px; 
            margin-bottom: 15px; 
            border-left: 5px solid #00c6ff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .admin-panel, .user-panel { max-width: 800px; margin: 20px auto; }
        textarea {
            width: 100%; height: 100px; margin-top: 10px;
            background: rgba(0, 0, 0, 0.4); color: #fff;
            border: 1px solid #00c6ff; border-radius: 8px;
            padding: 10px; font-family: inherit; resize: none;
        }
        .monitor-item {
            background: rgba(255,255,255,0.1); padding: 12px;
            margin: 8px 0; border-radius: 8px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .historial-item { border-left: 5px solid #7000ff !important; margin-top: 20px; }
        .btn-delete { background: none; border: none; color: #ff4d4d; cursor: pointer; font-size: 1.2em; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="../img/logo.png" alt="Logo WNTV" class="logo-principal" style="width: 270px;">
            <h1 class="neon-text">Soporte Nocturno</h1>
        </div>

        <!-- ACCESO -->
        <div id="login-section" class="form-container">
            <h3 style="color: #00c6ff; text-align: center; margin-bottom: 20px;">Acceso al Sistema</h3>
            <div style="display: flex; flex-direction: column; gap: 15px;">
                <input type="password" id="pass-admin" placeholder="Contraseña Administrador">
                <button onclick="checkLogin()" class="btn-guardar" style="background: linear-gradient(135deg, #00c6ff, #0072ff);">Entrar como Admin</button>
                <hr style="opacity: 0.2;">
                <button onclick="showUserPanel()" class="btn-back" style="width: 100%;">Entrar como Técnico</button>
            </div>
        </div>

        <!-- PANEL ADMINISTRADOR -->
        <div id="admin-panel" class="admin-panel hidden">
            <h2 style="color: #00c6ff;">⚙️ Registro de Usuarios</h2>
            <div class="form-container">
                <input type="text" id="nombre-cliente" placeholder="Nombre del Usuario a Soporte">
                <button onclick="agregarCliente()" class="btn-guardar" style="margin-top: 15px; width: 100%;">Añadir a la Lista</button>
            </div>
            
            <div class="form-container" style="margin-top: 20px;">
                <h3 style="color: #00c6ff; margin-bottom: 15px;">📊 Estado de Atenciones</h3>
                <div id="monitor-lista"></div>
            </div>
            <button onclick="logout()" class="btn-back" style="margin-top: 20px;">Cerrar Sesión</button>
        </div>

        <!-- PANEL TÉCNICO -->
        <div id="user-panel" class="user-panel hidden">
            <h2 style="color: #00c6ff;">📝 Registro de Actividades</h2>
            
            <div class="form-container" style="margin-bottom: 20px;">
                <input type="text" id="nombre-tecnico" placeholder="Nombre del Técnico de Turno" style="border-color: #7000ff;">
            </div>

            <div id="lista-clientes-soporte"></div>
            
            <div class="action-buttons" style="margin: 25px 0; display: flex; gap: 10px;">
                <button onclick="guardarTodoElSoporte()" class="btn-guardar" style="flex: 2;">💾 Guardar Registro Final</button>
                <button onclick="logout()" class="btn-back" style="flex: 1;">Volver</button>
            </div>

            <div style="margin-top: 40px;">
                <h2 style="color: #00c6ff; text-align: center;">📋 Historial de Atenciones</h2>
                <div id="log-historial-nocturno"></div>
            </div>
        </div>
    </div>
    <script src="soporte.js"></script>
</body>
</html>
