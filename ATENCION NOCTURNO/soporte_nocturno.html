<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte Nocturno - WNTV</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .hidden { display: none; }
        .soporte-card { 
            background: rgba(255, 255, 255, 0.05); 
            padding: 20px; 
            border-radius: 15px; 
            margin-bottom: 15px; 
            border-left: 5px solid #00c6ff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .admin-panel, .user-panel { max-width: 800px; margin: 20px auto; }
        textarea {
            width: 100%;
            height: 100px;
            margin-top: 10px;
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            border: 1px solid #00c6ff;
            border-radius: 8px;
            padding: 10px;
            font-family: inherit;
        }
        .status-badge { float: right; font-size: 1.2em; }
        .monitor-item {
            background: rgba(255,255,255,0.1);
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="../img/logo.png" alt="Logo WNTV" class="logo-principal" style="width: 270px;">
            <h1 class="neon-text">Soporte Nocturno</h1>
        </div>

        <!-- SECCIÓN DE ACCESO -->
        <div id="login-section" class="form-container">
            <h3 style="color: #00c6ff; text-align: center;">Seleccione su Rol</h3>
            <div style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
                <input type="password" id="pass-admin" placeholder="Contraseña Administrador">
                <button onclick="checkLogin()" class="btn-guardar" style="background: linear-gradient(135deg, #00c6ff, #0072ff);">Entrar como Admin</button>
                <hr style="opacity: 0.2;">
                <button onclick="showUserPanel()" class="btn-back" style="width: 100%;">Entrar como Técnico</button>
            </div>
        </div>

        <!-- PANEL ADMINISTRADOR -->
        <div id="admin-panel" class="admin-panel hidden">
            <h2 style="color: #00c6ff;">⚙️ Panel Administrador</h2>
            <div class="form-container">
                <input type="text" id="nombre-cliente" placeholder="Nombre del Cliente o Usuario">
                <button onclick="agregarCliente()" class="btn-guardar" style="margin-top: 15px; width: 100%;">Añadir a la Lista</button>
            </div>
            
            <div class="form-container" style="margin-top: 20px;">
                <h3 style="color: #00c6ff; margin-bottom: 10px;">📊 Monitoreo de Reportes</h3>
                <div id="monitor-lista"></div>
            </div>

            <button onclick="logout()" class="btn-back" style="margin-top: 20px;">Cerrar Sesión</button>
        </div>

        <!-- PANEL TÉCNICO -->
        <div id="user-panel" class="user-panel hidden">
            <h2 style="color: #00c6ff;">📝 Registro de Actividades</h2>
            <div id="lista-clientes-soporte"></div>
            
            <div class="action-buttons" style="margin-top: 20px; display: flex; gap: 10px;">
                <button onclick="guardarTodoElSoporte()" class="btn-guardar" style="flex: 1;">💾 Guardar Todo el Registro</button>
                <button onclick="logout()" class="btn-back">Volver</button>
            </div>
        </div>
    </div>
    <script src="soporte.js"></script>
</body>
</html>
