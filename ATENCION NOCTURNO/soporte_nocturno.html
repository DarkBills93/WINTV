<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte Nocturno - WNTV</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .hidden { display: none; }
        .soporte-card { 
            background: rgba(255, 255, 255, 0.05); 
            padding: 20px; 
            border-radius: 15px; 
            margin-bottom: 15px; 
            border-left: 5px solid #00c6ff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .admin-panel, .user-panel { max-width: 800px; margin: 20px auto; }
        
        /* ESTILO BASADO EN LA IMAGEN image_c5d2b8.png */
        .login-title { color: #00c6ff; text-align: center; font-weight: bold; margin-bottom: 15px; font-size: 1.2em; }
        .input-login {
            width: 100%; padding: 8px; border-radius: 5px; border: 2px solid #fff;
            background: transparent; color: #fff; margin-bottom: 15px; box-sizing: border-box;
        }
        .btn-admin-login {
            width: 100%; padding: 12px; border-radius: 10px; border: none;
            background: linear-gradient(to bottom, #00c6ff, #007bff);
            color: white; font-weight: bold; cursor: pointer; margin-bottom: 15px; font-size: 1em;
        }
        .btn-tech-login {
            width: 100%; padding: 12px; border-radius: 10px; border: none;
            background: #5b6fb3; color: white; font-weight: bold; cursor: pointer; font-size: 1em;
        }
        
        textarea {
            width: 100%; height: 100px; margin-top: 10px;
            background: rgba(0, 0, 0, 0.4); color: #fff;
            border: 1px solid #00c6ff; border-radius: 8px;
            padding: 10px; font-family: inherit; resize: none;
        }
        .monitor-item {
            background: rgba(255,255,255,0.1); padding: 12px;
            margin: 8px 0; border-radius: 8px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .historial-item { border-left: 5px solid #00c6ff !important; background: #0a192f !important; }
        .btn-delete { background: none; border: none; color: #ff4d4d; cursor: pointer; font-size: 1.1em; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="../img/logo.png" alt="Logo WNTV" class="logo-principal" style="width: 270px;">
            <h1 class="neon-text">Soporte Nocturno</h1>
        </div>

        <!-- ACCESO AL SISTEMA (REFINADO SEGÚN IMAGEN) -->
        <div id="login-section" class="form-container" style="max-width: 500px; margin: auto; background: #0a2540; padding: 30px; border-radius: 10px;">
            <div class="login-title">Acceso al Sistema</div>
            <input type="password" id="pass-admin" class="input-login" placeholder="Contraseña Administrador">
            <button onclick="checkLogin()" class="btn-admin-login">Entrar como Admin</button>
            <hr style="opacity: 0.2; margin-bottom: 15px;">
            <button onclick="showUserPanel()" class="btn-tech-login">Entrar como Técnico</button>
        </div>

        <!-- PANEL ADMINISTRADOR -->
        <div id="admin-panel" class="admin-panel hidden">
            <h2 style="color: #00c6ff;">⚙️ Registro de Usuarios</h2>
            <div class="form-container">
                <input type="text" id="nombre-cliente" placeholder="Nombre del Usuario a Soporte">
                <button onclick="agregarCliente()" class="btn-guardar" style="margin-top: 15px; width: 100%;">Añadir a la Lista</button>
            </div>
            
            <div class="form-container" style="margin-top: 20px;">
                <h3 style="color: #00c6ff; margin-bottom: 15px;">📊 Estado de Atenciones (En Vivo)</h3>
                <div id="monitor-lista"></div>
            </div>

            <div class="action-buttons" style="margin-top: 20px; display: flex; gap: 10px;">
                <button onclick="window.location.reload()" class="btn-back" style="flex: 1;">Volver</button>
            </div>
        </div>

        <!-- PANEL TÉCNICO -->
        <div id="user-panel" class="user-panel hidden">
            <h2 style="color: #00c6ff;">📝 Registro de Actividades</h2>
            <div class="form-container" style="margin-bottom: 20px;">
                <input type="text" id="nombre-tecnico" placeholder="Nombre del Técnico de Turno" style="border-color: #00c6ff;">
            </div>

            <div id="lista-clientes-soporte"></div>
            
            <div class="action-buttons" style="margin: 25px 0; display: flex; gap: 10px;">
                <button onclick="guardarTodoElSoporte()" class="btn-guardar" style="flex: 2;">💾 Guardar Registro Final</button>
                <button onclick="window.location.reload()" class="btn-back" style="flex: 1;">Volver</button>
            </div>

            <div style="margin-top: 40px;">
                <h2 style="color: #00c6ff; text-align: center;">📋 Historial de Atenciones</h2>
                <div id="log-historial-nocturno"></div>
            </div>
        </div>
    </div>
    <script src="soporte.js"></script>
</body>
</html>
